        explanation: "<b>සිංහල පැහැදිලි කිරීම:</b><br>Challenge-Response ක්‍රමයේදී Server එක විසින් සෑම පිවිසුමකදීම නැවත කිසිදා භාවිතා නොවන අහඹු අගයක් (Nonce/Challenge $R$) එවයි. Client විසින් තම රහස් යතුරෙන් එය Encrypt කර හෝ Hash කර ආපසු එවයි ($f(K, R)$). හැකර්වරයෙකු මෙම ප්‍රතිචාරය Record කරගෙන පසුව නැවත එව්වද (Replay attack), ඊළඟ වතාවේ Server එක වෙනස් Nonce එකක් එවන බැවින් පැරණි ප්‍රතිචාරයෙන් ඇතුළු විය නොහැක."

    },

    },

        question: "To protect the firewall from unauthorized direct connections, which rule should be implemented and where should it be placed?",
        type: "single",
        options: [

            "A rule accepting all traffic to 10.1.1.254 placed after Rule 9.",

            "A rule blocking outgoing traffic from 0.0.0.0/0 placed in the middle."
        ],
        correct: [0],
        explanation: "<b>සිංහල පැහැදිලි කිරීම:</b><br>Firewall එක වෙත එන අනවසර ප්‍රහාර (Brute force SSH, Web admin attacks) වැළැක්වීමට Destination IP = 10.1.1.254 වන පැකට් (විශ්වාසදායක පරිපාලක IP හැර) Deny කරන රීතියක් සකසා එය ලැයිස්තුවේ <b>ඉහළින්ම (At the very top)</b> ස්ථානගත කළ යුතුය."

        type: "single",
        options: [

// ---------- APPLICATION LOGIC ----------
const questionBadgeEl = document.getElementById('question-badge');
const scenarioContainerEl = document.getElementById('scenario-container');
const questionTextEl = document.getElementById('question-text');
const optionsListEl = document.getElementById('options-list');
const nextBtn = document.getElementById('next-btn');
const backBtn = document.getElementById('back-btn');
const progressTextEl = document.getElementById('progress-text');
const timerEl = document.getElementById('timer');
const navPaletteEl = document.getElementById('navigation-palette');
const quizContentEl = document.getElementById('quiz-content');
const paperSelectionContainerEl = document.getElementById('paper-selection-container');
const paperSelectionGridEl = document.getElementById('paper-selection-grid');
const feedbackEl = document.getElementById('feedback');
const explanationTextEl = document.getElementById('explanation-text');
const submitMultiBtn = document.getElementById('submit-multi-btn');

const TOTAL_PAPERS = 4;
const quizTimeInMinutes = 30; 

let currentPaperData = [];
let currentPaperIndex = 0;
let timeRemaining = quizTimeInMinutes * 60;
let timerInterval;
let quizFinished = false;

let currentQuestionIndex = 0;
let allUserAnswers = new Array(fullQuizData.length).fill(null);
let tempSelectedOptions = [];

function startTimer() {
    timerEl.style.display = 'inline-block';
    timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
    if (quizFinished) return;
    timeRemaining--;
    const minutes = Math.floor(timeRemaining / 60);
    let seconds = timeRemaining % 60;

    seconds = seconds < 10 ? '0' + seconds : seconds;
    const minutesStr = minutes < 10 ? '0' + minutes : minutes;

    timerEl.innerText = `${minutesStr}:${seconds}`;

    if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        showResults(true); 
    }
}

function loadPaper(paperNumber) {
    currentPaperIndex = paperNumber - 1;
    currentPaperData = fullQuizData.filter(q => q.paper === paperNumber);

    paperSelectionContainerEl.style.display = 'none';
    quizContentEl.style.display = 'block';

    currentQuestionIndex = 0;
    renderNavigationPalette();
    loadQuestion();
    startTimer();
}

function renderPaperSelection() {
    const titles = [
        "Question 1: Ceycorp Breach, Cryptanalysis & CIA Triad",
        "Question 2: Controls, Quantitative Risk Analysis (ALE) & Shannon",
        "Question 3: MAC Verification, Digital Certs & Access Matrix",
        "Question 4: Authentication, Challenge-Response & Firewalls"
    ];

    for (let i = 0; i < TOTAL_PAPERS; i++) {
        const count = fullQuizData.filter(q => q.paper === i + 1).length;
        const paperItem = document.createElement('div');
        paperItem.classList.add('paper-item');
        paperItem.dataset.paperNumber = i + 1;
        paperItem.innerHTML = `
            <h4>Section ${i + 1}</h4>
            <p style="font-weight:600; color:#0f172a; margin-bottom:6px;">${titles[i]}</p>
            <p>${count} Exam Scenarios</p>
        `;
        paperItem.addEventListener('click', (e) => {
            loadPaper(parseInt(e.currentTarget.dataset.paperNumber));
        });
        paperSelectionGridEl.appendChild(paperItem);
    }
}

function getGlobalIndex(paperIdx, questionIdx) {
    let offset = 0;
    for (let p = 0; p < paperIdx; p++) {
        offset += fullQuizData.filter(q => q.paper === p + 1).length;
    }
    return offset + questionIdx;
}

function renderNavigationPalette() {
    navPaletteEl.innerHTML = '';
    for (let i = 0; i < currentPaperData.length; i++) {
        const navItem = document.createElement('div');
        navItem.innerText = i + 1;
        navItem.classList.add('nav-box');
        navItem.dataset.index = i;
        navItem.addEventListener('click', (e) => {
            jumpToQuestion(parseInt(e.target.dataset.index));
        });
        navPaletteEl.appendChild(navItem);
    }
    updateNavigationPalette();
}

function updateNavigationPalette() {
    const navItems = navPaletteEl.children;

    for (let i = 0; i < navItems.length; i++) {
        const item = navItems[i];
        const globalIndex = getGlobalIndex(currentPaperIndex, i);
        item.classList.remove('current', 'answered-correct', 'answered-incorrect');

        const answer = allUserAnswers[globalIndex];

        if (answer !== null) {
            const currentQ = fullQuizData[globalIndex];
            const isCorrect = isAnswerCorrect(answer, currentQ.correct);
            if (isCorrect) {
                item.classList.add('answered-correct');
            } else {
                item.classList.add('answered-incorrect');
            }
        }
        
        if (i === currentQuestionIndex) {
            item.classList.add('current');
        }
    }
}

function isAnswerCorrect(userAns, correctAns) {
    if (!Array.isArray(userAns)) return false;
    if (userAns.length !== correctAns.length) return false;
    const sortedUser = [...userAns].sort();
    const sortedCorrect = [...correctAns].sort();
    return sortedUser.every((val, idx) => val === sortedCorrect[idx]);
}

function jumpToQuestion(index) {
    if (index >= 0 && index < currentPaperData.length) {
        currentQuestionIndex = index;
        loadQuestion();
    }
}

function loadQuestion() {
    const currentQuestion = currentPaperData[currentQuestionIndex];
    const globalQuestionIndex = getGlobalIndex(currentPaperIndex, currentQuestionIndex);
    const currentSavedAnswer = allUserAnswers[globalQuestionIndex];

    // Show Scenario if available
    if (currentQuestion.scenario) {
        scenarioContainerEl.innerHTML = currentQuestion.scenario;
        scenarioContainerEl.style.display = 'block';
    } else {
        scenarioContainerEl.style.display = 'none';
    }

    questionTextEl.innerHTML = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;
    optionsListEl.innerHTML = '';
    feedbackEl.style.display = 'none';
    submitMultiBtn.style.display = 'none';

    if (currentQuestion.type === 'multiple') {
        questionBadgeEl.innerText = "Multiple Answers (Select all that apply)";
        questionBadgeEl.className = "badge badge-multiple";
    } else {
        questionBadgeEl.innerText = "Single Choice";
        questionBadgeEl.className = "badge badge-single";
    }

    backBtn.disabled = currentQuestionIndex === 0;
    nextBtn.innerText = (currentQuestionIndex === currentPaperData.length - 1) ? 'Finish Section' : 'Next';
    nextBtn.disabled = (currentSavedAnswer === null && currentQuestionIndex < currentPaperData.length - 1);

    tempSelectedOptions = currentSavedAnswer ? [...currentSavedAnswer] : [];

    currentQuestion.options.forEach((optionText, idx) => {
        const li = document.createElement('li');
        li.classList.add('option');
        li.dataset.index = idx;

        const input = document.createElement('input');
        input.type = currentQuestion.type === 'multiple' ? 'checkbox' : 'radio';
        input.name = `question_${currentQuestionIndex}`;
        input.checked = tempSelectedOptions.includes(idx);

        const span = document.createElement('span');
        span.innerHTML = optionText;

        li.appendChild(input);
        li.appendChild(span);

        if (currentSavedAnswer === null) {
            li.addEventListener('click', () => handleOptionClick(idx, currentQuestion));
        } else {
            li.classList.add('no-hover');
            const isCorrect = currentQuestion.correct.includes(idx);
            const isSelected = currentSavedAnswer.includes(idx);

            if (isCorrect) li.classList.add('correct');
            if (isSelected && !isCorrect) li.classList.add('incorrect');
        }

        optionsListEl.appendChild(li);
    });

    if (currentSavedAnswer !== null) {
        showFeedback(currentQuestion);
    } else if (currentQuestion.type === 'multiple') {
        submitMultiBtn.style.display = 'inline-block';
        submitMultiBtn.disabled = tempSelectedOptions.length === 0;
    }

    progressTextEl.innerText = `Question ${currentQuestionIndex + 1} of ${currentPaperData.length} (Section ${currentPaperIndex + 1})`;
    updateNavigationPalette();
}

function handleOptionClick(index, question) {
    const globalQuestionIndex = getGlobalIndex(currentPaperIndex, currentQuestionIndex);
    if (allUserAnswers[globalQuestionIndex] !== null) return;

    if (question.type === 'single') {
        allUserAnswers[globalQuestionIndex] = [index];
        renderOptionStatesAfterAnswer(question, [index]);
        showFeedback(question);
        nextBtn.disabled = false;
        updateNavigationPalette();
    } else {
        const optIndex = tempSelectedOptions.indexOf(index);
        if (optIndex > -1) {
            tempSelectedOptions.splice(optIndex, 1);
        } else {
            tempSelectedOptions.push(index);
        }

        Array.from(optionsListEl.children).forEach((li, idx) => {
            const checkbox = li.querySelector('input');
            const isChecked = tempSelectedOptions.includes(idx);
            checkbox.checked = isChecked;
            if (isChecked) {
                li.classList.add('selected');
            } else {
                li.classList.remove('selected');
            }
        });

        submitMultiBtn.disabled = tempSelectedOptions.length === 0;
    }
}

submitMultiBtn.addEventListener('click', () => {
    const globalQuestionIndex = getGlobalIndex(currentPaperIndex, currentQuestionIndex);
    const currentQuestion = currentPaperData[currentQuestionIndex];

    allUserAnswers[globalQuestionIndex] = [...tempSelectedOptions];
    submitMultiBtn.style.display = 'none';

    renderOptionStatesAfterAnswer(currentQuestion, tempSelectedOptions);
    showFeedback(currentQuestion);
    nextBtn.disabled = false;
    updateNavigationPalette();
});

function renderOptionStatesAfterAnswer(question, userSelection) {
    Array.from(optionsListEl.children).forEach((li, idx) => {
        li.classList.add('no-hover');
        const isCorrect = question.correct.includes(idx);
        const isSelected = userSelection.includes(idx);

        if (isCorrect) li.classList.add('correct');
        if (isSelected && !isCorrect) li.classList.add('incorrect');
    });
}

function showFeedback(question) {
    const correctTexts = question.correct.map(i => `✔ ${question.options[i]}`).join('<br>');
    explanationTextEl.innerHTML = `
        <div style="font-weight: bold; color: #155724; margin-bottom: 6px;">Correct Answer:</div>
        <div style="margin-bottom: 12px; font-weight: 500; color: #14532d;">${correctTexts}</div>
        <hr style="border: 0; border-top: 1px solid #cbd5e1; margin-bottom: 10px;">
        <div>${question.explanation}</div>
    `;
    feedbackEl.style.display = 'block';
}

function showResults(timeIsUp = false) {
    quizFinished = true;
    clearInterval(timerInterval);

    let paperScore = 0;
    for (let i = 0; i < currentPaperData.length; i++) {
        const globalIndex = getGlobalIndex(currentPaperIndex, i);
        if (isAnswerCorrect(allUserAnswers[globalIndex], currentPaperData[i].correct)) {
            paperScore++;
        }
    }

    const quizContainer = document.getElementById('quiz-container');
    quizContainer.innerHTML = `
        <div id="header">
            <h2>${timeIsUp ? 'Time Expired!' : 'Section Completed!'}</h2>
        </div>
        <div id="question-area" style="text-align: center; padding: 45px 20px;">
            <h3 style="color: #0f172a;">Your Score for Section ${currentPaperIndex + 1}</h3>
            <p style="font-size: 3.5em; font-weight: bold; color: #2563eb; margin: 15px 0;">${paperScore} / ${currentPaperData.length}</p>
            <p style="font-size: 1.05em; color: #64748b;">${paperScore === currentPaperData.length ? 'Outstanding work! Full marks scored.' : 'Good effort! Review the explanations above to solidify your concepts.'}</p>
            <button id="restart-btn" style="background-color: #2563eb; color: white; border: none; padding: 12px 28px; border-radius: 6px; cursor: pointer; font-size: 1.1em; margin-top: 20px;">Choose Another Section</button>
        </div>
    `;
    document.getElementById('restart-btn').addEventListener('click', () => {
        location.reload();
    });
}

nextBtn.addEventListener('click', () => {
    if (currentQuestionIndex < currentPaperData.length - 1) {
        currentQuestionIndex++;
        loadQuestion();
    } else {
        showResults();
    }
});

backBtn.addEventListener('click', () => {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        loadQuestion();
    }
});

// Start with Paper Selection
renderPaperSelection();
</script>
